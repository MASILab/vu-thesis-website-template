# Builds the Eleventy site and the dissertation PDF, then publishes both to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pandoc, LaTeX and rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin latexmk \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science
          wget -q https://github.com/jgm/pandoc/releases/download/3.3/pandoc-3.3-1-amd64.deb
          sudo dpkg -i pandoc-3.3-1-amd64.deb

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        # base_path is "/<repo>" for project pages, "" for user pages or a custom domain
        run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - name: Build PDF
        run: npm run pdf && cp build/thesis.pdf _site/thesis.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
